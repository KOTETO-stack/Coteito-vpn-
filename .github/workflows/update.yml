name: Автообновление VPN-подписки

on:
  schedule:
    # Каждый час
    - cron: '0 * * * *'
  workflow_dispatch:
    # Ручной запуск через кнопку в GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          pip install pyyaml requests

      - name: Запуск сбора серверов
        run: |
          cd scripts
          python fetch.py
        timeout-minutes: 15

      - name: Запуск переименования
        run: |
          cd scripts
          python naming.py
        timeout-minutes: 30

      - name: Сборка sing-box конфига
        run: |
          cd scripts
          python build.py

      - name: Подстановка WARP ключа
        env:
          WARP_KEY: ${{ secrets.WARP_PRIVATE_KEY }}
        run: |
          if [ -n "$WARP_KEY" ]; then
            sed -i "s/680rOV1e-528C1qUx-W18x6j3Z/$WARP_KEY/g" output/sing-box.json
            echo "WARP ключ подставлен из Secrets"
          else
            echo "WARP ключ не найден в Secrets, используется дефолтный"
          fi

      - name: Проверка изменений
        id: check
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Изменений нет, коммит не требуется"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Есть изменения, требуется коммит"
          fi

      - name: Коммит и пуш
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "VPN Bot"
          git config user.email "vpn-bot@users.noreply.github.com"
          git commit -m "Автообновление: $(date '+%Y-%m-%d %H:%M') — серверов: $(wc -l < output/server_list.txt | tr -d ' ')"
          git push

      - name: Лог завершения
        run: |
          echo "Обновление завершено"
          echo "Серверов в подписке: $(wc -l < output/server_list.txt | tr -d ' ')"
